<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script data-goatcounter="https://theaob.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <style>
    :root { --bg: #f6f4ef; --ink: #1f1d1a; --muted: #645d54; --accent: #c8431f; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16151a; --ink: #eeeae4; --muted: #a39d94; --accent: #ff7a52; } }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 80px 16px; }
    h1 { margin: 0 0 8px; } p { color: var(--muted); } a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>That page doesn't exist. <a href="/">Go to the home page</a>.</p>
  </main>
</body>
</html>
